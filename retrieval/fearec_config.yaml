data_path: retrieval/data/
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]

user_inter_num_interval: "[3,inf)"

# FEARec Hyperparameter
embedding_size: 64
hidden_size: 64
inner_size: 256
n_heads: 2
n_layers: 2
hidden_dropout_prob: 0.1
attn_dropout_prob: 0.1
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
freq_random_ratio: 0.4
dual_domain: True
loss_type: CE
MAX_ITEM_LIST_LENGTH: 50

train_neg_sample_args: ~

epochs: 50
train_batch_size: 256
learner: adam
learning_rate: 0.001

eval_args:
  split:
    LS: valid_and_test
  order: TO
  group_by: user
  mode:
    valid: full
    test: full
metrics: [Recall, NDCG, Hit]
topk: [10, 20]
valid_metric: Recall@10

seed: 2024
